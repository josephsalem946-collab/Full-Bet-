<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="outerRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142c54"/>
      <stop offset="85%" stop-color="#0c1a36"/>
      <stop offset="100%" stop-color="#071024"/>
    </radialGradient>
    
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Gold 3D Gradient for FULL -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Filter for 3D Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Outer Ring with Glow -->
  <circle cx="250" cy="250" r="235" fill="#080e1e" stroke="url(#cyanBorder)" stroke-width="12" filter="url(#dropShadow)" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-opacity="0.6" />

  <!-- Inner Badge Center Background -->
  <circle cx="250" cy="250" r="200" fill="#0c1730" />

  <!-- Top Sports Arena Glow -->
  <ellipse cx="250" cy="180" rx="170" ry="120" fill="#132448" />

  <!-- 1. SOCCER BALL (Left) -->
  <g transform="translate(130, 160)" filter="url(#dropShadow)">
    <circle cx="50" cy="50" r="75" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
    <!-- Center pentagon -->
    <polygon points="50,25 72,42 63,68 37,68 28,42" fill="#0f172a" />
    <!-- Connecting seams & outer patches -->
    <polygon points="50,25 50,-5 25,-15 15,10 28,42" fill="#334155" />
    <polygon points="72,42 100,32 110,60 88,78 63,68" fill="#1e293b" />
    <polygon points="63,68 70,100 45,115 30,95 37,68" fill="#0f172a" />
    <polygon points="37,68 10,75 -5,50 5,30 28,42" fill="#1e293b" />
  </g>

  <!-- 2. CASINO CHIPS STACK (Right) -->
  <g transform="translate(290, 120)" filter="url(#dropShadow)">
    <!-- Bottom Chip: Red -->
    <g transform="translate(0, 80)">
      <ellipse cx="60" cy="25" rx="55" ry="18" fill="#991b1b" stroke="#f87171" stroke-width="2"/>
      <rect x="5" y="25" width="110" height="15" fill="#7f1d1d" />
      <ellipse cx="60" cy="40" rx="55" ry="18" fill="#b91c1c" stroke="#fca5a5" stroke-width="2"/>
    </g>
    <!-- Middle Chip: White -->
    <g transform="translate(0, 45)">
      <ellipse cx="60" cy="25" rx="55" ry="18" fill="#cbd5e1" stroke="#ffffff" stroke-width="2"/>
      <rect x="5" y="25" width="110" height="15" fill="#94a3b8" />
      <ellipse cx="60" cy="40" rx="55" ry="18" fill="#f1f5f9" stroke="#ffffff" stroke-width="2"/>
    </g>
    <!-- Top Chip: Blue -->
    <g transform="translate(0, 10)">
      <ellipse cx="60" cy="25" rx="55" ry="18" fill="#1e40af" stroke="#60a5fa" stroke-width="3"/>
      <rect x="5" y="25" width="110" height="18" fill="#1e3a8a" />
      <ellipse cx="60" cy="43" rx="55" ry="18" fill="#2563eb" stroke="#93c5fd" stroke-width="3"/>
      <circle cx="60" cy="43" r="24" fill="#172554" stroke="#bfdbfe" stroke-width="2"/>
      <text x="60" y="49" font-family="'Impact', Arial Black, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">500</text>
    </g>
  </g>

  <!-- 3. MAIN EMBOSSED TEXT: FULL -->
  <g filter="url(#dropShadow)">
    <!-- 3D Shadow layer -->
    <text x="250" y="260"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-size="118"
          font-weight="900"
          letter-spacing="2"
          fill="#451a03"
          text-anchor="middle">
      FULL
    </text>
    <!-- Main Gold Text -->
    <text x="250" y="252"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-size="118"
          font-weight="900"
          letter-spacing="2"
          fill="url(#gold3D)"
          stroke="url(#goldStroke)"
          stroke-width="5"
          text-anchor="middle">
      FULL
    </text>
  </g>

  <!-- 4. MULTISPORT & CASINO ICONS RIBBON -->
  <g transform="translate(0, 275)" filter="url(#dropShadow)">
    <!-- Ribbon Pill -->
    <rect x="75" y="0" width="350" height="38" rx="19" fill="#081024" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Icons spaced horizontally -->
    <!-- ⚽ Football -->
    <text x="110" y="26" font-size="20" text-anchor="middle">⚽</text>
    <!-- 🏀 Basketball -->
    <text x="160" y="26" font-size="20" text-anchor="middle">🏀</text>
    <!-- 🎾 Tennis -->
    <text x="210" y="26" font-size="20" text-anchor="middle">🎾</text>
    <!-- 🏃 Athlete -->
    <text x="260" y="26" font-size="20" text-anchor="middle">🏃</text>
    <!-- 🎰 Roulette / Casino -->
    <text x="315" y="26" font-size="20" text-anchor="middle">🎰</text>
    <!-- 💵 Money -->
    <text x="370" y="26" font-size="20" text-anchor="middle">💵</text>
  </g>

  <!-- 5. SIGNATURE TEXT: BET -->
  <g filter="url(#dropShadow)">
    <text x="250" y="380"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-size="82"
          font-weight="900"
          letter-spacing="6"
          fill="#1d4ed8"
          stroke="#00E5FF"
          stroke-width="3"
          text-anchor="middle">
      BET
    </text>
  </g>

  <!-- URL Subtitle -->
  <text x="250" y="420"
        font-family="'Courier New', monospace"
        font-size="15"
        font-weight="bold"
        letter-spacing="4"
        fill="#fde047"
        text-anchor="middle">
    FULLBET.COM
  </text>
</svg>
